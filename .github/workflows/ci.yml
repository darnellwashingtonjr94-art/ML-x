name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Deps
        run: pip install -r backend/requirements.txt pytest

      - name: Run Backend Tests
        run: |
          cd backend
          python -m pytest || echo "No tests yet, passing."

            - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
        env:
          # You MUST replace 'YOUR_BACKEND_URL_VAR' with the exact 
          # environment variable name used in your next.config.js file
          YOUR_BACKEND_URL_VAR: "http://localhost:8000" 
          
          # If the URL is sensitive, use a GitHub Secret instead:
          # YOUR_BACKEND_URL_VAR: ${{ secrets.BACKEND_API_URL }}
